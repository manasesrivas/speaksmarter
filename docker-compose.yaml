services:
  db:
    image: mysql:8.0
    container_name: speaksmarter_db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "speaksmarter"
      MYSQL_USER: "speaksmarter"
      MYSQL_PASSWORD: "password"
    ports:
      - "3306:3306"
    
    volumes:
      - dbdata:/var/lib/mysql

    networks:
      - speaksmarter_network
    
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: speaksmarter_app
    restart: unless-stopped
    working_dir: /var/www/html

    volumes:
      - ./backend:/var/www/html
    networks:
      - speaksmarter_network

  vite:
    image: node:26-bookworm-slim
    container_name: speaksmarker_vite
    working_dir: /var/www/html
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./backend:/var/www/html
      - vite_node_modules:/var/www/html/node_modules

    command: >
      sh -c "
      npm install -g pnpm@latest &&
      pnpm install &&
      pnpm run dev -- --host 0.0.0.0
      "

    networks:
      - speaksmarter_network
    
  web:
    image: nginx:1.31.9-alpine
    container_name: speaksmarter_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - speaksmarter_network

volumes:
  dbdata:
  vite_node_modules:

networks:
  speaksmarter_network: